<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#111120"/>
    </radialGradient>
    <radialGradient id="bladeGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5a5a7a"/>
      <stop offset="100%" stop-color="#1e1e30"/>
    </radialGradient>
    <radialGradient id="hubGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d3d5c"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="1" dy="2"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadow"/>
      <feFlood flood-color="#000" flood-opacity="0.5"/>
      <feComposite in2="shadow"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="#2e2e4a" stroke-width="1.5"/>

  <!-- Blade arm 1 (top-right) -->
  <path d="M100,100 C110,75 130,55 155,45 C165,55 158,72 148,80 C138,88 120,90 100,100 Z"
        fill="url(#bladeGrad)" stroke="#3a3a58" stroke-width="0.8"/>
  <!-- Blade arm 2 (bottom-right) -->
  <path d="M100,100 C125,108 148,118 158,142 C148,152 132,146 122,136 C112,126 108,114 100,100 Z"
        fill="url(#bladeGrad)" stroke="#3a3a58" stroke-width="0.8"/>
  <!-- Blade arm 3 (left) -->
  <path d="M100,100 C75,107 52,100 42,78 C50,65 66,66 78,74 C90,82 95,92 100,100 Z"
        fill="url(#bladeGrad)" stroke="#3a3a58" stroke-width="0.8"/>

  <!-- Blade edge highlights -->
  <path d="M100,100 C110,75 130,55 155,45" fill="none" stroke="#6a6a8a" stroke-width="1" opacity="0.6"/>
  <path d="M100,100 C125,108 148,118 158,142" fill="none" stroke="#6a6a8a" stroke-width="1" opacity="0.6"/>
  <path d="M100,100 C75,107 52,100 42,78" fill="none" stroke="#6a6a8a" stroke-width="1" opacity="0.6"/>

  <!-- Center hub ring -->
  <circle cx="100" cy="100" r="26" fill="url(#hubGrad)" stroke="#4a4a6a" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="22" fill="none" stroke="#3a3a55" stroke-width="1"/>

  <!-- Question mark -->
  <text x="100" y="109"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28"
        font-weight="bold"
        fill="#8888aa"
        text-anchor="middle"
        filter="url(#glow)"
        opacity="0.9">?</text>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#3a3a5a" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#252538" stroke-width="0.5" opacity="0.5"/>
</svg>
